repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv.lock
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # tests/vendored-support-dls is a byte-for-byte copy of the pinned
        # ibek-support-dls, and test_vendored_support.py checks it as such.
        # Tidying its line endings here would make that test fail with no way
        # to fix it short of editing the submodule.
        exclude: ^tests/vendored-support-dls/

  - repo: local
    hooks:
      - id: ruff
        name: lint with ruff
        language: system
        entry: ruff check --force-exclude --fix
        types: [python]
        require_serial: true

      - id: ruff-format
        name: format with ruff
        language: system
        entry: ruff format --force-exclude
        types: [python]
        require_serial: true

      - id: uv-sync
        name: update uv.lock and venv
        pass_filenames: false
        language: system
        entry: uv sync
        files: ^(uv\.lock|pyproject\.toml)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
