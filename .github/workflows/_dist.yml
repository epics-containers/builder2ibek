on:
  workflow_call:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Build sdist and wheel
        run: >
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) &&
          uv run --with build pyproject-build

      - name: Upload sdist and wheel as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Check for packaging errors
        run: uvx twine check --strict dist/*

      # The runner's system python can be older than requires-python, so
      # install into a venv on the version named in .python-version.
      - name: Install produced wheel
        run: >
          uv venv "$RUNNER_TEMP/wheel-venv" &&
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl

      - name: Test module --version works using the installed wheel
        # If more than one module in src/ replace with module name to test
        run: >
          "$RUNNER_TEMP/wheel-venv/bin/python"
          -m $(ls --hide='*.egg-info' src | head -1) --version
