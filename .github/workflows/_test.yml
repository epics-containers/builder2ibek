on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: The version of python to install, default is from .python-version file
        default: ""
      runs-on:
        type: string
        description: The runner to run this job on
        required: true

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Init ibek-support submodule
        run: git submodule update --init ibek-support

      # ibek-support-dls is on Diamond's internal GitLab, so the runner cannot
      # clone it. Drop in the vendored entity models instead, or 9 of the 14
      # samples skip -- every vacuum IOC among them. No-ops wherever the real
      # submodule is available, so this is CI only in practice.
      - name: Install vendored ibek-support-dls entity models
        run: python3 tests/vendor_support_dls.py --install

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run --locked tox -e tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          name: ${{ inputs.python-version }}/${{ inputs.runs-on }}
          files: cov.xml
