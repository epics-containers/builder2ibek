  - type: asyn.AsynIP
    name: ATT2Port
    port: 127.0.0.1:9091

  - type: attocubeInterf.ids3010
    P: BL08J-MO-INTRF-
    PORT: ATT1Port
    Q: '01'

  - type: attocubeInterf.ids3010
    P: BL08J-MO-INTRF-
    PORT: ATT2Port
    Q: '02'
