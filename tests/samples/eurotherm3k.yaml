# yaml-language-server: $schema=../ioc.schema.json

ioc_name: "{{  _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:

  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: '{{ ioc_name | upper }}'

  - type: eurothermModbus.Eurotherm3KPIDselect
    device: BL05J-EA-TCTRL-03:EUTH
    ipaddress: 127.0.0.1
    modbus_prefix: EURTHM_MB_1
    port: TCTRL3

  - type: eurothermModbus.EurothermLoopPIDselect
    device: BL05J-EA-TCTRL-03:EUTH
    loop_name: LOOP1

  - type: eurothermModbus.EurothermLoopPIDselect
    device: BL05J-EA-TCTRL-03:EUTH
    loop_name: LOOP2
