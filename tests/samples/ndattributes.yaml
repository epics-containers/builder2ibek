# yaml-language-server: $schema=/epics/ibek-defs/ioc.schema.json

ioc_name: "{{  _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:

  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: '{{ ioc_name | upper }}'

  - type: ADAravis.aravisCamera
    ATTRIBUTES_FILE: |
      <Attributes>
        <Attribute addr="0" datatype="STRING" description="Camera manufacturer" name="Manufacturer" source="MANUFACTURER" type="PARAM"/>
        <Attribute addr="0" datatype="INT" description="Image counter" name="ImageCounter" source="ARRAY_COUNTER" type="PARAM"/>
        <Attribute dbrtype="DBR_NATIVE" description="Ring current &amp; &quot;beam&quot; &lt;mA&gt;" name="RingCurrent" source="SR-DI-DCCT-01:SIGNAL" type="EPICS_PV"/>
        <Attribute dbrtype="DBR_DOUBLE" description="Undulator gap, the 'ID' gap" name="Gap" source="BL99P-MO-SERVC-01:CURRGAPD" type="EPICS_PV"/>
        <Attribute dbrtype="DBR_NATIVE" description="" name="DET1.cam.BL99P-EA-DET-01:CAM:Temperature_RBV" source="BL99P-EA-DET-01:CAM:Temperature_RBV" type="EPICS_PV"/>
      </Attributes>
    BUFFERS: 100
    ID: 127.0.0.1
    P: BL99P-EA-DET-01
    PORT: DET1.cam
    R: ':CAM:'

  - type: ADCore.NDProcess
    ATTRIBUTES_FILE: |
      <Attributes>
        <Attribute addr="1" datatype="INT" description="Process plugin input frame counter" name="procFrameCount" source="ARRAY_COUNTER" type="PARAM"/>
      </Attributes>
    NDARRAY_PORT: DET1.cam
    P: BL99P-EA-DET-01
    PORT: DET1.proc
    QUEUE: 20
    R: ':PROC:'

  - type: ADCore.NDStats
    ATTRIBUTES_FILE: |
      <Attributes>
        <Attribute addr="0" datatype="INT" description="Statistics plugin dropped frames" name="statFrameDrop" source="DROPPED_ARRAYS" type="PARAM"/>
      </Attributes>
    HIST_SIZE: 256
    NDARRAY_PORT: DET1.proc
    P: BL99P-EA-DET-01
    PORT: DET1.stat
    QUEUE: 20
    R: ':STAT:'
    XSIZE: 1296
    YSIZE: 966

  - type: ADCore.NDFileHDF5
    ATTRIBUTES_FILE: |
      <Attributes>
        <Attribute addr="0" datatype="INT" description="HDF5 plugin input frame counter" name="hdfFrameCount" source="ARRAY_COUNTER" type="PARAM"/>
      </Attributes>
    NDARRAY_PORT: DET1.cam
    P: BL99P-EA-DET-01
    PORT: DET1.hdf
    QUEUE: 90
    R: ':HDF5:'
