# yaml-language-server: $schema=/epics/ibek-defs/ioc.schema.json

ioc_name: "{{  _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:

  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: '{{ ioc_name | upper }}'

  - type: ether_ip.EtherIPInit
    device: SR17C-VA-VLVCC-01
    ip: 127.0.0.1
    port: VLVCC_01_EIP

  - type: ether_ip.ao
    port: VLVCC_01_EIP
    record: SR-RF-CVRST-01:CON
    scan: Passive
    tag: CAVITY_RESET_01 S .2

  - type: ether_ip.ao
    port: VLVCC_01_EIP
    record: SR-RF-CVRST-02:CON
    scan: Passive
    tag: CAVITY_RESET_02 S .2

  - type: ether_ip.ao
    port: VLVCC_01_EIP
    record: SR-RF-CVRST-03:CON
    scan: Passive
    tag: CAVITY_RESET_03 S .2
