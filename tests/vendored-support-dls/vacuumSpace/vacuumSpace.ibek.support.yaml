          First vacuum space

      space1:
        type: str
        description: |-
          Second vacuum space
        default: |-
          {{ space0 }}

      space2:
        type: str
        description: |-
          Third vacuum space
        default: |-
          {{ space0 }}

      space3:
        type: str
        description: |-
