  - name: spaceTemplate
    description: |-
      Simple vacuum space template. builder2ibek's vacuumSpace converter expands
          builder's `space` helper into this plus the *Group / dummy entities it
          needs, so this is what a converted IOC always contains.
    parameters:
      device:
        type: str
        description: |-
          device name

      name:
        type: str
        description: |-
          gui association name - optional in builder, and only ever rendered
          into the template's `# % gui` comments, so this is not a `type: id`
        default: ""

      ionp:
        type: str
        description: |-
          ion pump

      gauge:
        type: str
        description: |-
          combination gauge

      img:
        type: str
        description: |-
          IMG

      pirg:
        type: str
        description: |-
          Pirani gauge

      valve:
        type: str
        description: |-
          Vacuum valve

    databases:
      - file: $(VACUUMSPACE)/db/space.template
        args: { device, name, ionp, gauge, img, pirg, valve }

  - name: space_bTemplate
    description: |-
      Simple vacuum space template. Requires Group wrappers for its inputs.
          Recommended you use space object instead
    parameters:
      device:
        type: str
        description: |-
          device name

      ionp:
        type: str
        description: |-
          ion pump

      gauge:
        type: str
        description: |-
          combination gauge

      img:
        type: str
        description: |-
          IMG

      pirg:
        type: str
        description: |-
          Pirani gauge

      valve:
        type: str
        description: |-
          Note: The following relay numbers are mapped to the IMG or PIRG device number, not the absolute controller relay number.

      name:
        type: str
        description: |-
          gui association name - optional in builder, and only ever rendered
          into the template's `# % gui` comments, so this is not a `type: id`
        default: ""

      valveIlRelay:
        type: int
        description: |-
          Valve interlock IMG relay
        default: 1

      mpsIlRelay1:
        type: int
        description: |-
          Machine protection system interlock IMG relay
        default: 2

      mpsIlRelay2:
        type: int
        description: |-
          Machine protection system interlock IMG relay
        default: 3

      rgaIlRelay:
        type: int
        description: |-
          RGA interlock IMG relay
        default: 4

      ionPumpIlRelay:
        type: int
        description: |-
          Ion pump interlock PIRG relay
        default: 1

    databases:
      - file: $(VACUUMSPACE)/db/space_b.template
        args:
          ionp:
          name:
          img:
          pirg:
          valve:
          rgaIlRelay:
          ionPumpIlRelay:
          device:
          gauge:
          valveIlRelay:
          mpsIlRelay2:
          mpsIlRelay1:

