  - name: NX102_PreVacCoils_SMLVDT
    description: |-
      Template database for an LVDT on PreVac Sample Manipulator.
    parameters:
      <<: [ *tagidx ]
      device:
        type: str
        description: |-
          Mandatory. Device name.
      port:
        type: str
        description: |-
          Mandatory. Comms port (DLS NX102) PLC controller is on.
      lvdtID:
        type: str
        description: |-
          Mandatory. ID of the LVDT.  Defacto it is a number but it need not be.
      tag:
        type: str
        description: |-
          Mandatory. NX PLC tag string.
      lvdtprefix:
        type: str
        description: |-
          Optional.  Defaults to ":LVDT".                       Prefix for SM LVDT records.
        default: :LVDT
      lvdt_shortname:
        type: str
        description: |-
          Optional.  Defaults to "LVDT$(lvdtID)".               Short name of the LVDT.
        default: LVDT$(lvdtID)
      lvdt_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to "LVDT $(lvdtID)".              Short description of the LVDT.
        default: LVDT $(lvdtID)
      lvdt_longdesc:
        type: str
        description: |-
          Optional.  Defaults to "Manipulator LVDT $(lvdtID)".  Longer description of the LVDT.
        default: Manipulator LVDT $(lvdtID)
      tagidx:
        type: str
        description: |-
          Optional.  Defaults to "$(lvdtID)".                   NX PLC tag string array index.
        default: $(lvdtID)
      pos_SCAN:
        type: str
        description: |-
          Optional.  Defaults to ".5 second".  EPICS .SCAN field.  Scan rate for reading encoder.  NOTE: This is the normal EPICS .SCAN field scanrate and the EtherIP S Flag for scanrate is not in use here.
        default: .5 second
      pos_PREC:
        type: int
        description: |-
          Optional.  Defaults to 3.            Precision on the encoder position value.
        default: 3
      pos_EGU:
        type: str
        description: |-
          Optional.  Defaults to empty string. Engineering units on the encoder value.
        default: ""
      pos_LINR:
        type: str
        description: |-
          Optional.  Defaults to empty string. Values can be "NO CONVERSION", "SLOPE" (must define pos_ESLO and and pos_EOFF), "LINEAR" (must define pos_EGUL and pos_EGUF), (or name of special table) and it will default to "NO CONVERSION".  Conversion method for encoder value.  See EPICS record reference manual sections on the ai record and the convert menu and conversion.
        default: ""
      pos_EGUL:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Low end of LINEAR conversion scale for encoder value.
        default: ""
      pos_EGUF:
        type: str
        description: |-
          Optional.  Defaults to empty string.  High end or full value on LINEAR conversion scale for encoder value.
        default: ""
      pos_EOFF:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The offset on the value for SLOPE conversion.  It will default to 0.
        default: ""
      pos_ESLO:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The slope on the value for SLOPE conversion.  It will default to 1.
        default: ""
      pos_AOFF:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The raw adjustment offset on the value for conversion for all types of conversion.  It will default to 0.
        default: ""
      pos_ASLO:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The raw adjustment slope on the value for conversion for all types of conversion.   It will default to 1.
        default: ""
      pos_SMOO:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The smoothing fraction parameter on the smoothing algorithm, value between 0 (no smoothing) and 1 (value never changes), it will default to 0.
        default: ""
      pos_HOPR:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The position high operator display value.  Will default to 0.
        default: ""
      pos_LOPR:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The position low operator display value.   Will default to 0.
        default: ""
      pos_HIHI:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The position high high limit.  It will default to 0.
        default: ""
      pos_HIGH:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The position high limit.       It will default to 0.
        default: ""
      pos_LOW:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The position low limit.        It will default to 0.
        default: ""
      pos_LOLO:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The position low low limit.    It will default to 0.
        default: ""
      pos_HHSV:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The alarm severity for the HIHI alarm.  It will default to NO_ALARM.
        default: ""
      pos_HSV:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The alarm severity for the HIGH alarm.  It will default to NO_ALARM.
        default: ""
      pos_LSV:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The alarm severity for the LOW alarm.   It will default to NO_ALARM.
        default: ""
      pos_LLSV:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The alarm severity for the LOLO alarm.  It will default to NO_ALARM.
        default: ""
      pos_HYST:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The alarm deadband or hysteresis for the scaled position.                 It will default to 0.
        default: ""
      pos_ADEL:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The archiver deadband, to stop archiving noise, for the scaled position.  It will default to 0.
        default: ""
      pos_MDEL:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The monitor deadband, to stop reacting noise, for the scaled position.    It will default to 0.
        default: ""
      raw_EGU:
        type: str
        description: |-
          Optional.  Defaults to count.         Engineering units on the encoder raw value.
        default: count
      raw_HYST:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The alarm deadband or hysteresis for the raw position.                    It will default to 0.
        default: ""
      raw_ADEL:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The archiver deadband, to stop archiving noise, for the raw position.     It will default to 0.
        default: ""
      raw_MDEL:
        type: str
        description: |-
          Optional.  Defaults to empty string.  The monitor deadband, to stop reacting noise, for the raw position.       It will default to 0.
        default: ""
      slope_PREC:
        type: int
        description: |-
          Optional.  Defaults to 6.             Precision on the derived encoder slope value.
        default: 6
      cal_SCAN:
        type: str
        description: |-
          Optional.  Defaults to "1 second".   EPICS .SCAN field.  Scan rate for reading calibration parameters.  NOTE: This is the normal EPICS .SCAN field scanrate and the EtherIP S Flag for scanrate is not in use here.
        default: 1 second
      calout_scanrate:
        type: float
        description: |-
          Optional.  Defaults to .5            The value of scanrate which when writing to NX PLC the calibration output records set the EtherIP scanrate S flag to in their OUT field syntax to add the readback to one of the EtherIP scanlists.
        default: 0.5
      calena_readyval:
        type: int
        description: |-
          Optional.  Defaults to 0.            Value to return calibration update to (i.e. do nothing).                 (Pulse to this level as low).
        default: 0
      calena_onval:
        type: int
        description: |-
          Optional.  Defaults to 1.            Value to enable calibration updates   (i.e. to unlock the calibration).  (Pulse to this level as high).
        default: 1
      calena_offval:
        type: int
        description: |-
          Optional.  Defaults to 2.            Value to disable calibration updates  (i.e. to lock the calibration).    (Pulse to this level as high).  (The PLC will disable it anyway after a timeout period of 1 day).
        default: 2
      calena_pulsestartDLY:
        type: float
        description: |-
          Optional.  Defaults to 0.0           Delay in seconds before setting level to lock or unlock the calibration.
        default: 0.0
      calena_pulsewidthDLY:
        type: float
        description: |-
          Optional.  Defaults to 2.0.          Delay in seconds between starting lock or unlock pulse before and returning to ready level.
        default: 2.0
      calena_ONAM:
        type: str
        description: |-
          Optional.  Defaults to Unlocked.     Label for 1 state on calibration enable readback record.
        default: Unlocked
      calena_OSV:
        type: str
        description: |-
          Optional.  Defaults to MINOR.        Alarm severity for 1 state on calibration enable readback record.
        default: MINOR
      calena_ZNAM:
        type: str
        description: |-
          Optional.  Defaults to Locked.       Label for 0 state on calibration enable readback record.
        default: Locked
      calena_ZSV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.     Alarm severity for 0 state on calibration enable readback record.
        default: NO_ALARM
      trigger_scanrate:
        type: float
        description: |-
          Optional.  Defaults to .5            The value of scanrate which when writing to NX PLC triggers the trigger output records set the EtherIP scanrate S flag to in their OUT field syntax to add the readback to one of the EtherIP scanlists.
        default: 0.5
      trigger_onval:
        type: int
        description: |-
          Optional.  Defaults to 1.            Value to write to a trigger tag to pulse the trigger on.  Must be consistent with trigger_offval.  Together they allow the defininition of the trigger pulse as a blip or a dip with blip as the default.
        default: 1
      trigger_offval:
        type: int
        description: |-
          Optional.  Defaults to 0.            Value to write to a trigger tag to pulse the trigger off.  Must be consistent with trigger_onval.  Together they allow the defininition of the trigger pulse as a blip or a dip with blip as the default.
        default: 0
      trigger_ONAM:
        type: str
        description: |-
          Optional.  Defaults to Trigger On.   Label for 1 state on a trigger record.  Must be consistent with trigger_onval and trigger_offval.
        default: Trigger On
      trigger_ZNAM:
        type: str
        description: |-
          Optional.  Defaults to Trigger Off.  Label for 0 state on a trigger record.  Must be consistent with trigger_onval and trigger_offval.
        default: Trigger Off
      trigger_pulsestartDLY:
        type: float
        description: |-
          Optional.  Defaults to 1.0.          Delay in seconds between last calibration parameter write and pulsing the trigger.
        default: 1.0
      trigger_pulsewidthDLY:
        type: float
        description: |-
          Optional.  Defaults to 2.0.          Delay in seconds between sending Trigger On and Trigger Off writes when pulsing a trigger.
        default: 2.0

    databases:

      - file: $(DLSPLC)/db/NX102_PreVacCoils_SMLVDT.template
        args:
          .*:

  - name: overrideRequestMain
    description: |-
      Template allowing overrideRequestIndividual instances to be created
    parameters:
      <<: [ *PQ, *timeout ]
      outaddr:
        type: int
        description: |-
          Output address. Input address is $(outaddr)+1. E.g. if outaddr=80, read DM81 and write DM80.
      port:
        type: str
        description: |-
          Asyn port for doing serial comms

    databases:

      - file: $(DLSPLC)/db/dlsPLC_overrideRequestMain.template
        args:
          .*:

  - name: NX102_feTemperature
    description: |-
      Template database for an individual temperature on a front end
      temperature PLC.
    parameters:
      <<: [ *tagidx, *alarm_limits ]
      device:
        type: str
        description: |-
          PV prefix
      temp:
        type: str
        description: |-
          PV suffix
      port:
        type: str
        description: |-
          port name of ether_ip driver
      tag:
        type: str
        description: |-
          etherip tag
        default: Temp
      adel:
        type: float
        description: |-
          archiver deadband
        default: 0.2
      scalefac:
        type: int
        description: |-
          scale factor for temperature/setpoint (1 for new PLC templates, 10 for old where PLC reports in 10ths of a degree)
        default: 1
      tempcal:
        type: int
        description: |-
          temperature calibration offset in egu (default=0)
        default: 0
      prec:
        type: int
        description: |-
          precision for reporting value back
        default: 1
      disable_pv:
        type: str
        description: |-
          If set, then this is the value of A in disable_calc
        default: $(device)$(temp):ZERO
      disable_calc:
        type: str
        description: |-
          If this condition is met then save the current limit and set the limit to 3276.7, disabling the interlock for this PV
        default: A=1
      egu:
        type: str
        description: |-
          This associates an edm screen with the template
        default: C
      desc:
        type: str
        description: |-
          Description

    databases:

      - file: $(DLSPLC)/db/NX102_feTemperature.template
        args:
          .*:

