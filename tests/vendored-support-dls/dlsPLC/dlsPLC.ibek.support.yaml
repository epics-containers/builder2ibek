        default: :CTRL
      paramprefix:
        type: str
        description: |-
          Optional.  Defaults to :PARAM         Prefix for SM parameter records.
        default: :PARAM
      paramprec:
        type: int
        description: |-
          Optional.  Defaults to 0.             Precision of the parameter value.
        default: 0
