  - name: flow
    description: |-
      This template defines a bi records for representing low and lolo
      water flow switched read from MPS RIO boxes. Low switches will be read from
      their normal DM variable (E.g. DM4), Lolo switches from the relevant interlock
      bits. E.g. if interlock DM816..818 bit 4 is S1 water,
      use loloaddress=818,lolobit=4 for instantaneous lolo signal
    parameters:
      <<: [ *PQ ]
      DESC:
        type: str
        description: |-
          Description
      device:
        type: str
        description: |-
          EPICS name of the vacuum valve crate that connects to the RIO
      loaddress:
        type: str
        description: |-
          Address of lo DM variable. E.g. if lo signal is in DM4 bit1 then loaddress=4 lobit=1
      lobit:
        type: str
        description: |-
          Bit of lo DM variable. E.g. if lo signal is in DM4 bit1 then loaddress=4 lobit=1
      loloaddress:
        type: str
        description: |-
          Address of lolo DM variable. E.g. if lolo signal is in DM818 bit4 then loloaddress=818 lolobit=4
      lolobit:
        type: str
        description: |-
          Bit of lolo DM variable. E.g. if lolo signal is in DM818 bit4 then loloaddress=818 lolobit=4

    databases:

      - file: $(DLSPLC)/db/dlsPLC_flow.template
        args:
