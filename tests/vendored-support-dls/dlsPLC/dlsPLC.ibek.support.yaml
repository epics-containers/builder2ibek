  - name: NX102_PreVacCoils_SMPort
    description: |-
      Template database for status info regarding a Port on PreVac Sample Manipulator.
    parameters:
      <<: [ *tagidx ]
      device:
        type: str
        description: |-
          Mandatory. Device name.
      posportID:
        type: str
        description: |-
          Mandatory. ID of the vacuum port position for the sample manipulator.  Must be integer 1 to 8 or 0 for special case of Arm in RDC/UFO and overall status.
      port:
        type: str
        description: |-
          Mandatory. Comms port (DLS NX102) PLC controller is on.
      tag:
        type: str
        description: |-
          Mandatory. NX PLC tag string e.g. V (from V.Control[1])
      tagname:
        type: str
        description: |-
          Mandatory. NX PLC tag name.
      tagprefix:
        type: str
        description: |-
          Mandatory. NX PLC prefix to tag name.
      posportprefix:
        type: str
        description: |-
          Optional.  Defaults to ":POSPORT".            Prefix for the vacuum port position records.
        default: :POSPORT
      smready_bitno:
        type: int
        description: |-
          Optional.  Defaults to "1".                   Bit number in port position status for whether sample manipulator inside the chamber is in position ready to participate in the transfer, values 0-15.  The Arm/RDC/UFO port is likely to have non-default value, as it needs to address the "Master Interlock Status" bit, whereas the other ports address the "ReadyForTransfer" bit.  NOTE: The intended use is for signals derived from GPIO on GeoBricks with other sample manipulator motors on them.
        default: 1
      sampleholder_bitno:
        type: int
        description: |-
          Optional.  Defaults to "2".              Bit number in port position status for whether sample holder is present inside the chamber, values 0-15.  The Arm/RDC/UFO port is likely to have non-default value, as it needs to address the "Holder On Arm" bit, whereas the other ports address the "Sample Inside" bit.  NOTE: The sample holder might not have a sample in it!
        default: 2
      armadj_bitno:
        type: int
        description: |-
          Optional.  Defaults to "8".                   Bit number in port position status for whether RDC arm is adjacent to the chamber, values 0-15.  (The Arm/RDC/UFO port is likely to have non-default value, but it is not meaningful).
        default: 8
      desc_label0:
        type: str
        description: |-
          Optional.  Defaults to "PrepareForTransfer".  Descriptive label for bit0 of the Coil word.
        default: PrepareForTransfer
      desc_label1:
        type: str
        description: |-
          Optional.  Defaults to "ReadyForTransfer".    Descriptive label for bit1 of the Coil word.
        default: ReadyForTransfer
      desc_label2:
        type: str
        description: |-
          Optional.  Defaults to "SampleInside".        Descriptive label for bit2 of the Coil word.
        default: SampleInside
      desc_label3:
        type: str
        description: |-
          Optional.  Defaults to "Error".               Descriptive label for bit3 of the Coil word.
        default: Error
      desc_label4:
        type: str
        description: |-
          Optional.  Defaults to "Busy".                Descriptive label for bit4 of the Coil word.
        default: Busy
      desc_label5:
        type: str
        description: |-
          Optional.  Defaults to "GateOpenRequest".     Descriptive label for bit5 of the Coil word.
        default: GateOpenRequest
      desc_label6:
        type: str
        description: |-
          Optional.  Defaults to "GateOpen".            Descriptive label for bit6 of the Coil word.
        default: GateOpen
      desc_label7:
        type: str
        description: |-
          Optional.  Defaults to "GateClosed".          Descriptive label for bit7 of the Coil word.
        default: GateClosed
      desc_label8:
        type: str
        description: |-
          Optional.  Defaults to "ArmOnPort".           Descriptive label for bit8 of the Coil word.
        default: ArmOnPort
      desc_label9:
        type: str
        description: |-
          Optional.  Defaults to "ReservedForFuture".   Descriptive label for bit9 of the Coil word.
        default: ReservedForFuture
      desc_label10:
        type: str
        description: |-
          Optional.  Defaults to "".                    Descriptive label for bit10 of the Coil word.
        default: ""
      desc_label11:
        type: str
        description: |-
          Optional.  Defaults to "".                    Descriptive label for bit11 of the Coil word.
        default: ""
      desc_label12:
        type: str
        description: |-
          Optional.  Defaults to "".                    Descriptive label for bit12 of the Coil word.
        default: ""
      desc_label13:
        type: str
        description: |-
          Optional.  Defaults to "".                    Descriptive label for bit13 of the Coil word.
        default: ""
      desc_label14:
        type: str
        description: |-
          Optional.  Defaults to "".                    Descriptive label for bit14 of the Coil word.
        default: ""
      desc_label15:
        type: str
        description: |-
          Optional.  Defaults to "".                    Descriptive label for bit15 of the Coil word.
        default: ""
      longdesc:
        type: str
        description: |-
          Optional.  Defaults to "Manipulator Position Port $(posportID) status."  Description of position port.
        default: Manipulator Position Port $(posportID) status.
      shortdesc:
        type: str
        description: |-
          Optional.  Defaults to "Posport$(posportID)"  Short, abbreviated description of position port.
        default: Posport$(posportID)
      chamber_name:
        type: str
        description: |-
          Optional.  Defaults to "".               Name of vacuum chamber associated with position port.
        default: ""
      chamber_shortname:
        type: str
        description: |-
          Optional.  Defaults to "".               Short name of vacuum chamber associated with position port.
        default: ""
      valve_device:
        type: str
        description: |-
          Optional.  Defaults to "".               Device name of vacuum valve associated with position port.  So far it is a string for info only, no calcs.
        default: ""
      valve_shortname:
        type: str
        description: |-
          Optional.  Defaults to "".               Short, abbreviated name of vacuum valve associated with the position port.
        default: ""
      valve_desc:
        type: str
        description: |-
          Optional.  Defaults to "".               Description of vacuum valve associated with position port.
        default: ""

