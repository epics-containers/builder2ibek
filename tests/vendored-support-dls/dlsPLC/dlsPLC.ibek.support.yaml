  - name: NX102_vacValveBistable
    description: |-
      Template database for a bistable vacuum valve without debounce or raw air records.  It has different interlocks for opening and closing it.
    parameters:
      <<:
        [
          *tag,
          *tagidx,
          *allowpv,
          *whylocked,
          *con_label,
          *sta_label,
          *sta_sv,
          *ilksta_label,
          *ilksta_sv,
          *mode,
        ]
      device:
        type: str
        description: |-
          device name
      port:
        type: str
        description: |-
          EtherIP Port Name
      con_label3:
        type: str
        description: |-
          Label string for control value 3 (Optional - defaults to Close Enable)
        default: Close Enable
      con_label7:
        type: str
        description: |-
          Label string for control value 7 (Optional - defaults to "")
        default: ""
      sta_label7:
        type: str
        description: |-
          Label string for status value 7 (Optional - defaults to "")
        default: ""
      sta_sv7:
        type: str
        description: |-
          Alarm severity for status value 7 (Optional - defaults to NO_ALARM)
        default: NO_ALARM
      ilksta_label1:
        type: str
        description: |-
          Label string for status value 1 (Optional - defaults to Open Disabled)
        default: Open Disabled
      ilksta_label2:
        type: str
        description: |-
          Label string for status value 2 (Optional - defaults to Closed, Open Available)
        default: Closed, Open Available
      ilksta_label3:
        type: str
        description: |-
          Label string for status value 3 (Optional - defaults to Open)
        default: Open
      ilksta_label4:
        type: str
        description: |-
          Label string for status value 4 (Optional - defaults to Close Disabled)
        default: Close Disabled
      ilksta_label5:
        type: str
        description: |-
          Label string for status value 5 (Optional - defaults to Open, Close Available)
        default: Open, Close Available
      ilksta_label6:
        type: str
        description: |-
          Label string for status value 6 (Optional - defaults to Closed)
        default: Closed
      ilksta_label7:
        type: str
        description: |-
          Label string for status value 7 (Optional - defaults to "")
        default: ""
      ilksta_sv6:
        type: str
        description: |-
          Alarm severity for interlock status value 6 (Optional - defaults to NO_ALARM)
        default: NO_ALARM
      ilksta_sv7:
        type: str
        description: |-
          Alarm severity for interlock status value 7 (Optional - defaults to NO_ALARM)
        default: NO_ALARM
      DIRILK1:
        type: str
        description: |-
          Part of ILK1 PV name (dollar(device):dollar(DIRILK1)ILK), named for "direction" of operation controlled by ILK1, e.g. set to OPEN for Bistable valve (Optional - defaults to OPEN)
        default: OPEN
      DIRILK1_label:
        type: str
        description: |-
          Label string for the interlock 1 "direction".  (Optional - defaults to Open)
        default: Open
      DIRILK2:
        type: str
        description: |-
          Part of ILK2 PV name (dollar(device):dollar(DIRILK2)ILK), named for "direction" of operation controlled by ILK2, e.g. set to CLOSE for Bistable valves (Optional - defaults to CLOSE)
        default: CLOSE
      DIRILK2_label:
        type: str
        description: |-
          Label string for the interlock 2 "direction".  (Optional - defaults to Close)
        default: Close
      desc:
        type: str
        description: |-
          Box label for gui                        (Optional - defaults to value of device macro)
        default: $(device)
      valvetype:
        type: str
        description: |-
          Type of valve for the gui.          (Optional - defaults to valve).
        default: valve

    databases:

      - file: $(DLSPLC)/db/NX102_vacValveBistable.template
        args:
          .*:

  - name: NX102_flowMeter
    description: |-
