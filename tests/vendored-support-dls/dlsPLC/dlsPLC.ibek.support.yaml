  - name: NX102_temperature
    description: |-
      Template database for an individual temperature on an Omron NX102 PLC.
    parameters:
      <<: [ *tagidx, *alarm_limits ]
      device:
        type: str
        description: |-
          PV prefix
      temp:
        type: str
        description: |-
          PV suffix
      port:
        type: str
        description: |-
          port name of ether_ip driver
      tag:
        type: str
        description: |-
          Optional.  Tag name on PLC     Defaults to "Temp" for e.g. Temp.Value[tagindex] E
        default: Temp
      adel:
        type: float
        description: |-
          Optional.  Archiver deadband.  Defaults to 0.2
        default: 0.2
      scalefac:
        type: int
        description: |-
          Optional.  Scale factor for temperature/setpoint (1 for new PLC templates, 10 for old where PLC reports in 10ths of a degree).  Defaults to 1.
        default: 1
      tempcal:
        type: int
        description: |-
          Optional.  Temperature calibration offset in egu. Defaults to 0
        default: 0
      prec:
        type: int
        description: |-
          Optional.  Precision for reporting value back.    Defaults to 1
        default: 1
      disable_pv:
        type: str
        description: |-
          Optional.  If set, then this is the value of A in disable_calc.  Defaults to $(device)$(temp):ZERO
        default: $(device)$(temp):ZERO
      disable_calc:
        type: str
        description: |-
          Optional.  If this condition is met then save the current limit and set the limit to 3276.7, disabling the interlock for this PV.  Defaults to A=1
        default: A=1
      egu:
        type: str
        description: |-
          Optional.  Engineering units for temperature.     Defaults to C
        default: C
      desc:
        type: str
        description: |-
          Description

    databases:

      - file: $(DLSPLC)/db/NX102_temperature.template
        args:
          .*:

