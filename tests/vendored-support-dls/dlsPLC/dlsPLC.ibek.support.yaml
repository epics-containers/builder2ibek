###############################################################################
# the entity models for fast vacuum and fast vacuum channels are hand coded to
# include the complex processing originally implemented in builder.py
###############################################################################

entity_models:

  - name: fastVacuumMaster
    description: |-
      master records for fast vacuum
    parameters:

      name:
        type: id
        description: |-
          Object name, used by fastVacuumChannel to reference this master

      dom:
        type: str
        description: |-
          Domain, eg, FE06I

      fins_port:
        type: object
        description: |-
          FINS port

      eip_port:
        type: str
        description: |-
          EtherIP port

    post_defines:
      device:
        description: device name
        value: |-
          {{dom}}-VA-VFAST-01

      waveform_nelm:
        description: waveform element count
        value: "500"

      combined_nelm:
        description: total waveform element count
        value: |-
          {{ (6 * waveform_nelm|int) }}

    databases:

      - file: $(DLSPLC)/db/dlsPLC_fastVacuumMaster.template
        args: { device, eip_port }

  - name: fastVacuumChannel
    description: |-
      Adds a fast vacuum channel to the fast vacuum master
    pre_defines:
      gaugeNum:
        description: auto gauge count
        value: |-
          {{ _global.incrementor("fvGaugeNum", start=1) }}

      fan:
        description: fan number
        value: |-
          {{ "%02d" % (gaugeNum | int / 7 + 1) }}

      mask:
        description: mask for the channel
        value: |-
          {{ _global.set('fvMask', _global.get('fvMask', 0) + 2**(gaugeNum | int)) }}

    parameters:
      <<: [ *timeout ]

      master:
        type: object
        description: |-
          Master

      img:
        type: str
        description: |-
          Base IMG PV

      id:
        type: enum
        description: |-
          FV PLC gauge number
        values:
          "01":
          "02":
          "03":
          "04":
          "05":
          "06":
          "07":
          "08":
          "09":
          "10":
      em:
        type: enum
        description: |-
          EM block to use
        default: 0
        values:
          "0":
          "1":
          "2":
    post_defines:
      lnk_no:
        description: link number
        value: |-
          {{ ((gaugeNum | int - 1) % 6) + 1 }}

      gaugePV:
        description: Gauge PV
        value: |-
          {{ master.device }}:GAUGE{{id}}_0

      addr_offset:
        description: waveform address offset for the first waveform for this channel
        value: |-
          {{ (gaugeNum | int - 1) * (master.combined_nelm | int) }}

      wave0_addr:
        description: waveform address
        value: |-
          {{ (addr_offset | int) + (master.waveform_nelm | int) * 0 }}

      wave1_addr:
        description: waveform address
        value: |-
          {{ (addr_offset | int) + (master.waveform_nelm | int) * 1 }}

      wave2_addr:
        description: waveform address
        value: |-
          {{ (addr_offset | int) + (master.waveform_nelm | int) * 2 }}

      wave3_addr:
        description: waveform address
        value: |-
          {{ (addr_offset | int) + (master.waveform_nelm | int) * 3 }}

      wave4_addr:
        description: waveform address
        value: |-
          {{ (addr_offset | int) + (master.waveform_nelm | int) * 4 }}

      wave5_addr:
        description: waveform address
        value: |-
          {{ (addr_offset | int) + (master.waveform_nelm | int) * 5 }}

    databases:

      - file: $(DLSPLC)/db/dlsPLC_fastVacuumLink.template
        args: { device: "{{master.device}}", lnk_no, lnk: "{{gaugePV}}", fan, mask }

      - file: $(DLSPLC)/db/dlsPLC_fastVacuumChannel.template
        args:
          device: "{{master.device}}"
          img:
          fins_port: "{{master.fins_port}}"
          eip_port: "{{master.eip_port}}"
          tagidx: "{{ (id | string).strip('0') }}"
          id: "{{id}}"
          em:
          waveform_nelm: "{{master.waveform_nelm}}"
          wave0_addr:
          wave1_addr:
          wave2_addr:
          wave3_addr:
          wave4_addr:
          wave5_addr:
          combined_nelm: "{{master.combined_nelm}}"
          timeout:

  - name: overrideRequestIndividual
    description: |-
      Template allowing override of individual interlock bits
    parameters:
      P:
        type: str
        description: |-
          device prefix
      DESC:
        type: str
        description: |-
          Description (e.g. DCM piezo override)
      PRESSURE1:
        type: str
        description: |-
          Pressure in mbar that needs to be over setpoint to allow override
      PRESSURE2:
        type: str
        description: |-
          Pressure in mbar that needs to be over setpoint to allow override
      OVERRIDE:
        type: str
        description: |-
          P of overrideRequestMain instance
      BIT:
        type: int
        description: |-
          Bit of overrideRequestMain instance to use (0-8)
      SETPOINT:
        type: int
        description: |-
          Setpoint in mbar that both pressures need to be higher than to allow override

    databases:

      - file: $(DLSPLC)/db/dlsPLC_overrideRequestIndividual.template
        args:
          .*:

  - name: softwareVersion
    description: |-
      Template that reads software version from a PLC.
    parameters:
      device:
        type: str
        description: |-
          Device prefix

    databases:

      - file: $(DLSPLC)/db/dlsPLC_softwareVersion.template
        args:
          .*:

  - name: vacValveBistable
    description: |-
      Template database for a vacuum valve with different interlocks for open and close operations
    parameters:
      <<:
        [
          *vlvcc,
          *allowpv,
          *whylocked,
          *timeout,
          *ilk,
          *cilk,
          *con_label,
          *sta_label,
          *sta_sv,
          *ilksta_label,
          *ilksta_sv,
          *mode,
        ]
      device:
        type: id
        description: |-
          device name
      port:
        type: str
        description: |-
          asyn port name of FINS driver
      valvetype:
        type: str
        description: |-
          Template argument
        default: valve

    databases:

      - file: $(DLSPLC)/db/dlsPLC_vacValveBistable.template
        args:
          .*:

  - name: writeEnum
    description: |-
      Write the Enum value into a DM variable in a PLC
    parameters:
      <<: [ *PQ, *timeout ]
      port:
        type: str
        description: |-
