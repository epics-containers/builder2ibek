  - name: NX102_PreVacCoils_SMControl
    description: |-
      Template database for a control of PreVac Sample Manipulator.  Two parameters for source and target chambers (where to transfer sample from and to respectively) have to be written.  Further writes to NX PLC registers act commands to turn on motors and gas, and transfer commands for Prepare, Transfer, Abort, Reset.  Each of these writes has to have associated pulsed trigger writes to cause the NX PLC to act on the latest value.  The NX PLC processes the requested value and decides whether to pass it to the PreVac Modbus PLC.  If the latter, the PreVac Modbus PLC also processes the requested value and decides whether to act on it or not.  EPICS does not have any direct communication with the PreVac Modbus PLC.  Intentions for macros as follows: (1) Strings for posportID<n>_shortdesc macros should be provided only for ports which are present, but they should be left alone as empty strings for ports which are not present.  (2) Alarm severities of MAJOR should be defined for posportID<n>_SV macros for ports which are not present, but those which are present are left alone as NO_ALARM.  (3) Setting the posportID<n>_compass macros must result in a unique compass direction for all ports n=1-8 for the embedded diagram display on the Control screen to work properly.  The default values conform to this.  (4) Set targetparam_init to a posport ID number of a port which is present.  (5) The value of posportIDs_allowedmask defaults to a safe value of 0, which causes no transfers to be allowed, so you must define it according to the ports present to allow transfers.  (NOTE: In descriptions and macro names, "arm" is a noun referring to the sample manipulator arm and not a verb as used for a fast valve).
    parameters:
      device:
        type: str
        description: |-
          Mandatory. Device name.
      port:
        type: str
        description: |-
          Mandatory. Comms port (DLS NX102) PLC controller is on.
      tag_sourceparam:
        type: str
        description: |-
          Mandatory. NX PLC tag string to write the source chamber parameter.
      tag_targetparam:
        type: str
        description: |-
          Mandatory. NX PLC tag string to write the target chamber parameter.
      tag_setcoil:
        type: str
        description: |-
          Mandatory. NX PLC tag string to set a Coil to TRUE.
      tag_unsetcoil:
        type: str
        description: |-
          Mandatory. NX PLC tag string to set a Coil to FALSE.
      tag_Tsourceparam:
        type: str
        description: |-
          Optional.  Defaults to T$(tag_sourceparam).  NX PLC tag string to set the trigger to set the source chamber parameter.
        default: T$(tag_sourceparam)
      tag_Ttargetparam:
        type: str
        description: |-
          Optional.  Defaults to T$(tag_targetparam).  NX PLC tag string to set the trigger to set the target chamber parameter.
        default: T$(tag_targetparam)
      tag_Tsetcoil:
        type: str
        description: |-
          Optional.  Defaults to T$(tag_setcoil).      NX PLC tag string to set the trigger to set a Coil to TRUE.
        default: T$(tag_setcoil)
      tag_Tunsetcoil:
        type: str
        description: |-
          Optional.  Defaults to T$(tag_unsetcoil).    NX PLC tag string to set the trigger to set a Coil to FALSE.
        default: T$(tag_unsetcoil)
      coilout_scanrate:
        type: float
        description: |-
          Optional.  Defaults to .2   The value of scanrate which when writing to NX PLC the coil output records set the EtherIP scanrate S flag to in their OUT field syntax to add the readback to one of the EtherIP scanlists. (These are the records which run commands).
        default: 0.2
      paramout_scanrate:
        type: float
        description: |-
          Optional.  Defaults to .2   The value of scanrate which when writing to NX PLC the parameter output records set the EtherIP scanrate S flag to in their OUT field syntax to add the readback to one of the EtherIP scanlists.
        default: 0.5
      trigger_scanrate:
        type: float
        description: |-
          Optional.  Defaults to .2   The value of scanrate which when writing to NX PLC triggers the trigger output records set the EtherIP scanrate S flag to in their OUT field syntax to add the readback to one of the EtherIP scanlists.
        default: 0.2
      posportIDs_allowedmask:
        type: int
        description: |-
          Optional.  Defaults to 0.   Mask of bits set for each posportID number which is allowed as source and target.  (i.e. a chamber is present).  Bit 0 represents the Arm - do NOT set that bit, it is not allowed as a target and has special functionality for error recovery as a source.  Although the macro is optional, the default value doesnt allow any transfers, so you must set this.
        default: 0
      posportID0_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to Arm.           Short (for menu) description of zeroth port (for error recovery only).  The posportID1...7_shortdesc macros are not populated by default, so you must set some of them to get a readable menu button.
        default: Arm
      posportID1_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 1.
        default: ""
      posportID2_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 2.
        default: ""
      posportID3_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 3.
        default: ""
      posportID4_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 4.
        default: ""
      posportID5_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 5.
        default: ""
      posportID6_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 6.
        default: ""
      posportID7_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 7.
        default: ""
      posportID8_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to empty string.  Short (for menu) description of posport 8.
        default: ""
      posportID0_sourceSV:
        type: str
        description: |-
          Optional.  Defaults to MINOR.         Alarm severity for posport ID 0 for the Arm as source.  It is allowed as part of error recovery.
        default: MINOR
      posportID0_targetSV:
        type: str
        description: |-
          Optional.  Defaults to MAJOR.         Alarm severity for posport ID 0 for the Arm as target.
        default: MAJOR
      posportID1_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 1, same for source and target.
        default: NO_ALARM
      posportID2_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 2, same for source and target.
        default: NO_ALARM
      posportID3_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 3, same for source and target.
        default: NO_ALARM
      posportID4_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 4, same for source and target.
        default: NO_ALARM
      posportID5_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 5, same for source and target.
        default: NO_ALARM
      posportID6_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 6, same for source and target.
        default: NO_ALARM
      posportID7_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 7, same for source and target.
        default: NO_ALARM
      posportID8_SV:
        type: str
        description: |-
          Optional.  Defaults to NO_ALARM.      Alarm severity for posport ID 8, same for source and target.
        default: NO_ALARM
      posportID1_compass:
        type: str
        description: |-
          Optional.  Defaults to E.             Allowed values N,NW,W,SW,S,SE,E,NE.  Position in the layout of the sample manipulator diagram on the control screen brought up from the Control button on the generated screen for posport ID1.
        default: E
      posportID2_compass:
        type: str
        description: |-
          Optional.  Defaults to NE.            Allowed values N,NW,W,SW,S,SE,E,NE.  Position in the layout of the sample manipulator diagram on the control screen brought up from the Control button on the generated screen, posport ID2.
        default: NE
      posportID3_compass:
        type: str
        description: |-
          Optional.  Defaults to N.             Allowed values N,NW,W,SW,S,SE,E,NE.  Position in the layout of the sample manipulator diagram on the control screen brought up from the Control button on the generated screen, posport ID3.
        default: N
      posportID4_compass:
        type: str
        description: |-
          Optional.  Defaults to NW.            Allowed values N,NW,W,SW,S,SE,E,NE.  Position in the layout of the sample manipulator diagram on the control screen brought up from the Control button on the generated screen, posport ID4.
