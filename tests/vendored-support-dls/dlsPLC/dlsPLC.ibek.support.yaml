        type: str
        description: |-
          Optional.  Defaults to Source.        Short description or name of the Source parameter.
        default: Source
      targetparam_shortdesc:
        type: str
        description: |-
          Optional.  Defaults to Target.        Short description or name of the Target parameter.
        default: Target
      sourceparam_longdesc:
        type: str
        description: |-
          Optional.  Defaults to $(sourceparam_shortdesc=Source) chamber to move from.  Long description of the Source Parameter.
        default: $(sourceparam_shortdesc=Source) chamber to move from.
      targetparam_longdesc:
        type: str
        description: |-
          Optional.  Defaults to $(targetparam_shortdesc=Target) chamber to move to.  Long description of the Target Parameter.
        default: " $(targetparam_shortdesc=Target) chamber to move to."
      sourceparam_init:
        type: int
        description: |-
          Optional.  Defaults to 0 (Arm).       Initial value of the user demand for the Source parameter.  Helps the display on reboot in the absence of autosave.
        default: 0
      targetparam_init:
        type: int
        description: |-
          Optional.  Defaults to 1.             Initial value of the user demand for the Target parameter.  Helps the display on reboot in the absence of autosave.  The default value could not be left at 0 because the Arm is never allowed as target.  The value of 1 is arbitrary.  Recommend set this to the ID of one of the ports which is present in the manipulator configuration.
        default: 1
      trigger_onval:
        type: int
        description: |-
          Optional.  Defaults to 1.             Value to write to a trigger tag to pulse the trigger on.  Must be consistent with trigger_offval.  Together they allow the defininition of the trigger pulse as a blip or a dip with blip as the default.
        default: 1
      trigger_offval:
        type: int
        description: |-
          Optional.  Defaults to 0.             Value to write to a trigger tag to pulse the trigger off.  Must be consistent with trigger_onval.  Together they allow the defininition of the trigger pulse as a blip or a dip with blip as the default.
        default: 0
      trigger_ONAM:
        type: str
        description: |-
          Optional.  Defaults to Trigger On.    Label for 1 state on a trigger record.  Must be consistent with trigger_onval and trigger_offval.
        default: Trigger On
      trigger_ZNAM:
        type: str
        description: |-
          Optional.  Defaults to Trigger Off.   Label for 0 state on a trigger record.  Must be consistent with trigger_onval and trigger_offval.
        default: Trigger Off
      trigger_pulseDLY:
        type: float
        description: |-
          Optional.  Defaults to 1.0.           Delay in seconds between sending Trigger On and Trigger Off writes when pulsing a trigger.
        default: 1.0
