  - name: vacValve
    description: |-
      Template database for a vacuum valve without debounce or raw air records
    parameters:
      <<:
        [
          *vlvcc,
          *allowpv,
          *whylocked,
          *timeout,
          *ilk,
          *gilk,
          *con_label,
          *sta_label,
          *sta_sv,
          *mode,
          *ilksta_label,
          *ilksta_sv,
        ]
      device:
        type: id
        description: |-
          device name
      port:
        type: str
        description: |-
          asyn port name of FINS driver
      desc:
        type: str
        description: |-
          Box label for gui
        default: $(device)

    databases:

      - file: $(DLSPLC)/db/dlsPLC_vacValve.template
        args:
          .*:

  - name: NX102_sequence
    description: |-
      Template database for control and interlock of a non-specific device.
    parameters:
      <<:
        [
          *tagidx,
          *allowpv,
          *whylocked,
          *con_label,
          *sta_label,
          *sta_sv,
          *ilksta_label,
          *ilksta_sv,
          *mode,
        ]
      device:
        type: str
        description: |-
          device name
      port:
        type: str
        description: |-
          port name of ether_ip driver
      tag:
        type: str
        description: |-
          NX PLC tag string e.g. S (from S.Interfc[1])
      whylocked:
        type: str
        description: |-
          String to output to EDM synoptic as to precisely why the device is locked and by whom (Optional.  Defaults to "Open command not allowed")
        default: Start command not allowed
