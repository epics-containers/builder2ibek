        type: str
        description: |-
          Device Prefix

      R:
        type: str
        description: |-
          Device Suffix

      DTYP:
        type: str
        description: |-
          Device Type

      INP:
        type: str
        description: |-
          Input link
        default: ""

      SCAN:
        type: str
        description: |-
          Scan Rate

      ZNAM:
        type: str
        description: |-
          Name for zero state

      ONAM:
        type: str
        description: |-
          Name for one state

      ZSV:
        type: str
        description: |-
          optional macro to allow zero state alarm severity to be set.
        default: ""

      OSV:
        type: str
        description: |-
          optional macro to allow one state alarm severity to be set.
        default: ""

      COSV:
        type: str
        description: |-
          optional macro to allow change of state alarm severity to be set.
        default: ""

      DESC:
        type: str
        description: |-
          Description
        default: Binary Input

      archiver_rate:
        type: str
        description: |-
          archiver rate
        default: "10"

    databases:
      - file: $(USERIO)/db/bi.template
        args: { P: null, R: null, DTYP: null, INP: null, SCAN: null, ZNAM: null, ONAM: null, ZSV: null, OSV: null, COSV: null, DESC: null, archiver_rate: null }

