  - name: ai
    description: |-
      Template database for an Analogue In for user patch panels, etc.
    parameters:
      P:
        type: str
        description: |-
          Mandatory.  Device Prefix - Used to construct ai record name.

      R:
        type: str
        description: |-
          Mandatory.  Device Suffix - Used to construct ai record name.

      DTYP:
        type: str
        description: |-
          Mandatory.  EPICS ai record DTYP field - Device Type
        default: ""

      INP:
        type: str
        description: |-
          Mandatory.  EPICS ai record INP  field - Input link
        default: ""

      SCAN:
        type: str
        description: |-
          Mandatory.  EPICS ai record SCAN field - Scan Rate
        default: ""

      PREC:
        type: int
        description: |-
          Mandatory.  EPICS ai record PREC field - Precision
        default: 2

      EGUL:
        type: float
        description: |-
          Mandatory.  EPICS ai record EGUL field - low scale
        default: 0

      EGUF:
        type: float
        description: |-
          Mandatory.  EPICS ai record EGUF field - full scale
        default: 0

      EGU:
        type: str
        description: |-
          Mandatory.  EPICS ai record EGU field  - engineering units.
        default: ""

      LINR:
        type: str
        description: |-
          Mandatory.  EPICS ai record LINR field - conversion method to engineering units, can be NO CONVERSION, LINR or SLOPE or see EPICS record reference manual for temperature conversions.
        default: NO CONVERSION

      DESC:
        type: str
        description: |-
          Optional.  Defaults to Analogue Input.  Description of input signal.
        default: Analogue Input

      archiver_rate:
        type: str
        description: |-
          Optional.  Defaults to 10.     EPICS archiver rate configuration.
        default: "10"

    databases:
      - file: $(USERIO)/db/ai.template
        args:
          EGUF:
          SCAN:
          DTYP:
          INP:
          LINR:
          PREC:
          EGUL:
          P:
          R:
          EGU:
          DESC:
          archiver_rate:

